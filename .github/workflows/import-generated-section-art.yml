name: Import generated section art

on:
  push:
    branches:
      - generated-section-assets
    paths:
      - .github/workflows/import-generated-section-art.yml

permissions:
  contents: write

jobs:
  import-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Download and split generated atlas
        run: python tools/import-generated-section-art.py

      - name: Verify all generated files
        run: |
          test "$(find assets/generated/section-art -maxdepth 1 -name '*.webp' | wc -l)" -eq 19
          du -h assets/generated/section-art/*.webp

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/section-art
          git commit -m "Add generated Himalayan section art assets"
          git push
