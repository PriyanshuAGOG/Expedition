name: Import mossy milestone asset

on:
  push:
    branches:
      - generated-section-assets
    paths:
      - .github/workflows/import-mossy-milestone.yml

permissions:
  contents: write

jobs:
  import-asset:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Import generated milestone cluster
        run: python tools/import-mossy-milestone.py

      - name: Verify generated file
        run: test -s assets/generated/section-art/20-mossy-milestone-cluster.webp

      - name: Commit generated asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/section-art/20-mossy-milestone-cluster.webp
          git commit -m "Add generated mossy milestone cluster asset"
          git push
