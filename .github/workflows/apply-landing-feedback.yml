name: Apply landing page feedback

on:
  push:
    branches:
      - agent/landing-page-feedback
    paths:
      - .github/workflows/apply-landing-feedback.yml

permissions:
  contents: write

jobs:
  patch-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/landing-page-feedback

      - name: Apply approved content revisions
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          def regex_once(text: str, pattern: str, replacement: str, label: str) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f"{label}: expected 1 match, found {count}")
              return updated

          index_path = Path("index.html")
          index = index_path.read_text(encoding="utf-8")

          index = replace_once(
              index,
              '<meta name="build-version" content="2026.07.31-hero-clearance-v20">',
              '<meta name="build-version" content="2026.08.01-content-feedback-v21">',
              "build version",
          )
          index = replace_once(
              index,
              '<p><strong>21 people</strong> · 60 days · one six-day Himalayan expedition</p>',
              '<p><strong>60 days of preparation</strong> · one six-day Himalayan expedition · World Diabetes Day 2026</p>',
              "hero summary",
          )
          index = replace_once(
              index,
              '<p>We are bringing 21 people living with Type&nbsp;2 diabetes together to prepare carefully, act visibly and learn responsibly.</p>',
              '<p>We are bringing people living with Type&nbsp;2 diabetes together to prepare carefully, act visibly and learn responsibly.</p>',
              "purpose introduction",
          )
          index = replace_once(
              index,
              '<p>Diabetes requires awareness, preparation and responsibility, but it should not automatically require a smaller life. With appropriate medical screening, physical preparation, acclimatisation, glucose monitoring and professional support, people living with Type 2 diabetes can continue to pursue meaningful and challenging goals.</p>',
              '<p>Diabetes requires awareness, preparation and responsibility, but it should not automatically require a smaller life. With appropriate medical guidance, thoughtful planning and preparation, regular monitoring and the right support, people living with Type 2 diabetes can continue to pursue adventures, ambitions and challenging goals that are meaningful to them.</p>',
              "purpose one second paragraph",
          )
          index = replace_once(
              index,
              '<p>This is not a claim that everyone with diabetes should climb a mountain. Participants will be medically screened and trained, and the expedition will be supported by experienced trekking professionals and a medical and scientific governance framework. Safety remains the summit.</p>',
              '',
              "purpose one final paragraph",
          )
          index = replace_once(
              index,
              '<p>Existing research is limited and not fully consistent. Hypoxia has sometimes been associated with lower glucose or improved glucose utilisation, while rapid ascent, physical stress, poor sleep, dehydration and acute mountain sickness can also worsen glycaemic control. We will not present altitude as a therapy or claim that climbing a mountain reverses diabetes.</p>',
              '<p>Existing research is limited and not fully consistent. Some studies suggest that hypoxia may be associated with lower glucose levels or improved glucose utilisation. However, the available evidence is still limited and does not establish altitude as a treatment for diabetes. We will therefore study and document the experience responsibly, without claiming that climbing a mountain can reverse diabetes.</p>',
              "altitude research paragraph",
          )
          index = replace_once(
              index,
              '<p>Subject to appropriate medical and research oversight, measures such as continuous glucose monitoring, Time in Range, glucose variability, physical activity, sleep, oxygen saturation and symptoms may be observed before, during and after the expedition.</p>',
              '',
              "research measures paragraph",
          )
          index = replace_once(
              index,
              '''          </details>
        </div>
        <a class="inline-apply reveal" href="apply.html" target="_top"><span>Interested in joining the expedition?</span><strong>Apply Now ↗</strong></a>''',
              '''          </details>
          <details>
            <summary><span><small>Purpose 03</small>To inspire action around the world</span><i aria-hidden="true">+</i></summary>
            <div class="purpose-detail">
              <p>This expedition is not only about the people who participate in this expedition. It is also about inspiring millions of people living with Type 2 diabetes to believe that change is possible and to begin taking meaningful action to realise that possibility.</p>
              <p>For someone with diabetes, climbing a mountain represents every difficult first step: changing a habit, improving sleep, becoming more active, eating differently and managing stress. By showing what people can achieve through preparation, discipline and support, we hope to encourage others across the world to begin their own journey towards better metabolic health and a life of greater possibility.</p>
              <p class="purpose-boundary">Each one’s “mountain” may look different. What matters is taking that first step towards conquering the mountain.</p>
            </div>
          </details>
        </div>
        <a class="inline-apply reveal" href="apply.html" target="_top"><span>Interested in joining the expedition?</span><strong>Apply Now ↗</strong></a>''',
              "purpose three",
          )

          index = replace_once(
              index,
              '''          <p class="kicker">The expedition at a glance</p>
          <h2 id="gateway-title">The expedition<br><em>at a glance.</em></h2>
          <div class="glance-live"><span>Preparation begins before the mountain</span><strong><b data-countdown-days>—</b> days to World Diabetes Day</strong></div>''',
              '''          <div class="glance-live glance-live-prominent" style="margin:0 auto clamp(1.5rem,4vw,3rem);padding:clamp(1rem,2vw,1.4rem) clamp(1.25rem,3vw,2.25rem);max-width:44rem;border:1px solid rgba(215,246,168,.5);background:rgba(7,18,13,.72);backdrop-filter:blur(12px);box-shadow:0 18px 55px rgba(0,0,0,.28);"><span style="font-size:clamp(.78rem,1.5vw,.95rem);letter-spacing:.14em;text-transform:uppercase;">The journey begins now</span><strong style="font-size:clamp(1.55rem,4vw,2.9rem);line-height:1.05;"><b data-countdown-days>—</b> days to World Diabetes Day</strong></div>
          <p class="kicker">The expedition at a glance</p>
          <h2 id="gateway-title">The expedition<br><em>at a glance.</em></h2>''',
              "prominent countdown",
          )
          index = replace_once(
              index,
              '<div><small>Participants</small><strong>21</strong><span>adults with Type 2 diabetes</span></div>',
              '<div><small>Daily commitment</small><strong>75 min</strong><span>each morning in September and October</span></div>',
              "participant fact replacement",
          )
          index = replace_once(
              index,
              '<div><small>Altitude</small><strong>11–13k</strong><span>feet, subject to approval</span></div>',
              '<div><small>Altitude</small><strong>7–12K</strong><span>feet, route dependent</span></div>',
              "altitude fact",
          )
          index = replace_once(
              index,
              '<div><small>Route</small><strong>In review</strong><span>medical and mountain-safety approval</span></div>',
              '<div><small>Route</small><strong>Being finalised</strong><span>details will be announced</span></div>',
              "route fact",
          )
          index = regex_once(
              index,
              r'\n        <details class="glance-more reveal">.*?</details>',
              '',
              "selection and support box",
          )

          new_preparation = '''      <div class="prep-intro reveal"><p class="kicker">60 days before departure</p><h2 id="preparation-title">How participants<br><em>will prepare.</em></h2><p>Sixty days of practical, progressive preparation across five connected pillars.</p></div>
      <div class="prep-pillars" aria-label="Five preparation pillars">
        <article class="reveal"><b>01</b><h3>Medical</h3><p>Baseline assessment, treating-physician coordination, regular monitoring and final medical clearance.</p></article>
        <article class="reveal"><b>02</b><h3>Lifestyle</h3><p>Nutrition, sleep, recovery and sustainable routines that support metabolic health.</p></article>
        <article class="reveal"><b>03</b><h3>Fitness</h3><p>Progressive walking, strength, mobility, stamina and practical readiness for the trail.</p></article>
        <article class="reveal"><b>04</b><h3>Mind</h3><p>Stress management, breathwork, meditation and mental preparation for demanding days.</p></article>
        <article class="reveal"><b>05</b><h3>Community</h3><p>Group accountability, shared learning, regular check-ins and support throughout the journey.</p></article>
      </div>'''
          index = regex_once(
              index,
              r'      <div class="prep-intro reveal">.*?</div>\n      <div class="prep-pillars".*?</div>\n      <div class="field-note reveal">.*?</div>',
              new_preparation,
              "five preparation pillars",
          )

          new_expedition = '''      <div class="expedition-copy reveal"><p class="kicker">The six-day expedition</p><h2 id="expedition-title">What the expedition<br><em>will involve.</em></h2><p>The expedition will involve daily walking on Himalayan terrain, changing weather, early starts, simple mountain accommodation and shared group routines. Participants will be expected to follow the agreed pace, safety instructions and daily schedule throughout the journey.</p></div>
      <div class="route-status reveal"><span>Route status</span><strong>Route and itinerary being finalised</strong><p>The final region, altitude profile, daily distances, terrain, accommodation, equipment requirements and acclimatisation approach will be shared before travel.</p></div>
      <details class="route-reveal reveal">
        <summary>What participants should expect <span>+</span></summary>
        <div><span>Daily walking</span><span>Variable terrain</span><span>Simple mountain stays</span><span>Early starts</span><span>Changing weather</span><span>Shared routines</span><span>Required trek equipment</span><a href="https://indiahikes.com/documented-treks" target="_blank" rel="noopener">Explore the Indiahikes trek library ↗</a></div>
      </details>'''
          index = regex_once(
              index,
              r'      <div class="expedition-copy reveal">.*?</details>',
              new_expedition,
              "expedition involvement section",
          )

          index = replace_once(index, 'Medical safety<br><em>comes first.</em>', 'Safety<br><em>comes first.</em>', "safety heading")
          index = replace_once(
              index,
              'Health history, baseline investigations, physician approval and individual risk assessment.',
              'Health history, baseline investigations and physician approval.',
              "screening copy",
          )
          index = replace_once(
              index,
              'Fitness and health response are reviewed throughout the 60 days.',
              'Physical and mental fitness before the expedition.',
              "progressive preparation copy",
          )
          index = replace_once(
              index,
              'A final medical decision is required before joining the expedition.',
              'Fitness Certificate from the treating physician and medical approval from the NirogBhumi designated consultant.',
              "travel clearance copy",
          )
          index = regex_once(
              index,
              r'\n        <div class="governance reveal">.*?</div>',
              '',
              "governance box",
          )

          index = replace_once(
              index,
              '<article class="check-panel reveal"><span class="check-icon">✓</span><p>Good starting fit</p><ul><li>Adult living with Type 2 diabetes</li><li>Ready for medical screening and guidance</li><li>Able to commit about one hour each morning</li><li>Available around 14 November 2026</li><li>Open to group accountability and learning</li></ul></article>',
              '<article class="check-panel reveal"><span class="check-icon">✓</span><p>Eligibility</p><ul><li>Adult living with Type 2 diabetes</li><li>Does not have any diabetes-related complications</li><li>Able to commit about one hour and 15 minutes each morning during September and October</li><li>Available from November 12–19, 2026 for the expedition</li></ul></article>',
              "eligibility panel",
          )
          index = replace_once(
              index,
              '<article class="check-panel requirements reveal"><span class="check-icon">→</span><p>Have these details ready</p><ul><li>Personal and contact details</li><li>Type 2 diabetes history and current medication</li><li>Recent fasting and post-meal glucose readings</li><li>Latest HbA1c and relevant medical reports</li><li>Treating doctor details, health history and availability</li></ul></article>',
              '<article class="check-panel requirements reveal"><span class="check-icon">→</span><p>Have these details ready</p><ul><li>Personal and contact details</li><li>Year of Type 2 diabetes diagnosis, current treatment and latest HbA1c if known</li><li>Current activity level and relevant diagnosed conditions</li><li>Morning-time commitment for September and October, and availability from November 12–19</li><li>Your motivation and emergency-contact details</li></ul></article>',
              "application details panel",
          )
          index = regex_once(
              index,
              r'\n      <div class="health-boundary reveal">.*?</div>',
              '',
              "health boundary",
          )
          index = replace_once(
              index,
              '<p class="medical-note reveal">Application does not guarantee selection. NirogBhumi does not replace your treating doctor. Never stop or change medication without medical supervision.</p>',
              '<p class="medical-note reveal">Every application remains subject to individual medical screening and final medical clearance from a NirogBhumi designated consultant. Application does not guarantee selection.</p>',
              "medical note",
          )

          new_dashboard = '''      <details class="preparation-dashboard reveal" aria-labelledby="dashboard-title">
        <summary><div><p class="kicker">Preparation journey tracker</p><h3 id="dashboard-title">Public milestones, never private health data.</h3></div><span>View progress <i aria-hidden="true">+</i></span></summary>
        <div class="dashboard-grid">
          <div><strong>Opening soon</strong><small>Application status</small></div>
          <div><strong>Not started</strong><small>Participant selection</small></div>
          <div><strong>September</strong><small>Preparation begins</small></div>
          <div><strong>0 / 60</strong><small>Preparation days completed</small></div>
          <div><strong>Not started</strong><small>Morning sessions</small></div>
          <div><strong>Not started</strong><small>Community check-ins</small></div>
          <div><strong>Being finalised</strong><small>Route details</small></div>
          <div><strong><b data-countdown-days>—</b> days</strong><small>To World Diabetes Day</small></div>
        </div>
      </details>'''
          index = regex_once(
              index,
              r'      <details class="preparation-dashboard reveal".*?</details>',
              new_dashboard,
              "preparation tracker",
          )

          index = replace_once(
              index,
              '<p>Apply for one of 21 expedition places.</p>',
              '<p>Apply to join the expedition and the 60-day preparation journey.</p>',
              "participant pathway",
          )
          index = replace_once(
              index,
              '<div><span>Group</span><strong>21 people</strong></div>',
              '<div><span>Dates</span><strong>12–19 Nov</strong></div>',
              "registration group fact",
          )
          index = replace_once(
              index,
              'No. Up to 21 people will be selected through multiple stages based on medical safety, readiness, commitment and group fit.',
              'No. Participants will be selected through multiple stages based on medical safety, readiness, commitment and group fit.',
              "faq selection answer",
          )
          index = index.replace('Programme amount', 'Programme Fee')
          index = index.replace('programme amount', 'programme fee')

          index_path.write_text(index, encoding="utf-8")

          apply_path = Path("apply.html")
          apply = apply_path.read_text(encoding="utf-8")
          apply = replace_once(
              apply,
              '<div><span>Group</span><strong>21 people</strong></div>',
              '<div><span>Eligibility</span><strong>Adults with Type 2 diabetes</strong></div>',
              "application group fact",
          )
          apply = replace_once(
              apply,
              'Can you commit about one hour each morning? *',
              'Can you commit about one hour and 15 minutes each morning? *',
              "application time commitment",
          )
          apply = replace_once(
              apply,
              'Available for six days around 14 Nov 2026? *',
              'Available from November 12–19, 2026? *',
              "application availability",
          )
          apply = apply.replace('Programme amount', 'Programme Fee')
          apply = apply.replace('programme amount', 'programme fee')
          apply_path.write_text(apply, encoding="utf-8")
          PY

      - name: Verify requested changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          index = Path('index.html').read_text(encoding='utf-8')
          apply = Path('apply.html').read_text(encoding='utf-8')

          forbidden = {
              'index fixed participant count': ['>21<', '21 people', '21 expedition places', 'Up to 21'],
              'old programme label': ['Programme amount', 'programme amount'],
              'old altitude': ['11–13k'],
              'old route approval wording': ['medical and mountain-safety approval'],
              'old governance box': ['Science & medical governance'],
              'old preparation count': ['six connected pillars', 'Six preparation systems'],
              'daily field note': ['Daily field note'],
          }
          for label, terms in forbidden.items():
              for term in terms:
                  if term in index or term in apply:
                      raise SystemExit(f'{label} still contains: {term}')

          required = [
              'Purpose 03',
              'To inspire action around the world',
              '7–12K',
              'Five preparation pillars',
              'Safety<br><em>comes first.</em>',
              'Fitness Certificate from the treating physician',
              'Preparation journey tracker',
              'November 12–19, 2026',
              'https://indiahikes.com/documented-treks',
          ]
          for term in required:
              if term not in index and term not in apply:
                  raise SystemExit(f'missing required content: {term}')
          PY

      - name: Commit revised landing page
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html apply.html
          git rm .github/workflows/apply-landing-feedback.yml
          git commit -m "Apply expedition landing page feedback [skip ci]"
          git push origin HEAD:agent/landing-page-feedback
