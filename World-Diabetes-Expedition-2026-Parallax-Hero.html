<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08110d">
  <meta name="description" content="World Diabetes Day Expedition 2026, a cinematic journey through the mountains.">
  <title>World Diabetes Day Expedition 2026</title>
  <style>
:root {
  --p: 0;
  --d: 0;
  --intro: 0;
  --exit: 0;
  --mx: 0;
  --my: 0;
  --back-o: 1;
  --middle-o: 1;
  --front-o: 1;
  --ivory: #f2f0df;
  --pine: #0a1710;
  --line: rgba(242, 240, 223, 0.48);
}

* {
  box-sizing: border-box;
}

html {
  background: #07100c;
  color: var(--ivory);
  scrollbar-width: thin;
  scrollbar-color: rgba(232, 239, 211, 0.38) #07100c;
}

body {
  margin: 0;
  overflow-x: hidden;
  background: #07100c;
  font-family: "Helvetica Neue", "Arial Narrow", Arial, sans-serif;
}

img {
  display: block;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.parallax-hero {
  position: relative;
  height: 430vh;
  min-height: 2200px;
  background: #07100c;
}

.hero-sticky {
  position: sticky;
  top: 0;
  height: 100vh;
  min-height: 600px;
  overflow: hidden;
  isolation: isolate;
  background: #a8b0a5;
}

.scene,
.hero-chrome {
  position: absolute;
  inset: 0;
}

.scene {
  overflow: hidden;
}

.layer {
  position: absolute;
  z-index: 0;
  top: -5vh;
  left: -5vw;
  width: 110vw;
  height: 110vh;
  object-fit: cover;
  object-position: 50% 50%;
  pointer-events: none;
  user-select: none;
  will-change: transform;
  backface-visibility: hidden;
}

.layer-bg {
  z-index: 0;
  transform: translate3d(
    calc(var(--mx) * -0.16vw),
    calc((var(--d) * -2.2vh) + (var(--my) * -0.12vh)),
    0
  );
}

.sun-bloom {
  position: absolute;
  z-index: 1;
  top: -28vh;
  left: -18vw;
  width: 78vw;
  height: 78vw;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 245, 195, 0.3), rgba(255, 225, 155, 0.09) 38%, transparent 70%);
  mix-blend-mode: screen;
  transform: translate3d(calc(var(--mx) * -0.25vw), calc(var(--d) * -2vh), 0);
  pointer-events: none;
}

.mist {
  position: absolute;
  z-index: 1;
  left: 18vw;
  width: 64vw;
  height: 12vh;
  border-radius: 50%;
  filter: blur(22px);
  background: radial-gradient(ellipse, rgba(231, 235, 221, 0.2), transparent 68%);
  mix-blend-mode: screen;
  will-change: transform, opacity;
  pointer-events: none;
}

.mist-a {
  top: 56vh;
  opacity: calc(0.65 - var(--exit) * 0.45);
  transform: translate3d(calc((var(--d) * -5vw) + (var(--mx) * 0.3vw)), calc(var(--d) * -2vh), 0);
}

.mist-b {
  top: 66vh;
  opacity: calc(0.46 - var(--exit) * 0.38);
  transform: translate3d(calc((var(--d) * 7vw) + (var(--mx) * -0.2vw)), calc(var(--d) * -3.5vh), 0);
}

.layer-far {
  z-index: 2;
}

.layer-far-left {
  transform: translate3d(
    calc((var(--d) * 0.7vw) + (var(--mx) * -0.24vw)),
    calc((var(--d) * -2.4vh) + (var(--my) * -0.15vh)),
    0
  );
}

.layer-far-right {
  transform: translate3d(
    calc((var(--d) * -0.7vw) + (var(--mx) * -0.24vw)),
    calc((var(--d) * -2.4vh) + (var(--my) * -0.15vh)),
    0
  );
}

.title-band {
  position: absolute;
  left: 50%;
  width: min(94vw, 1700px);
  text-align: center;
  color: var(--ivory);
  pointer-events: none;
  will-change: transform, opacity;
  filter: drop-shadow(0 4px 22px rgba(5, 12, 8, 0.38));
}

.title-line {
  display: flex;
  justify-content: center;
  align-items: baseline;
  gap: 0.16em;
  white-space: nowrap;
  text-transform: uppercase;
  font-weight: 700;
  line-height: 0.78;
  letter-spacing: -0.078em;
}

.title-back {
  z-index: 3;
  top: 24vh;
  opacity: var(--back-o);
  transform: translate3d(
    calc(-50% + var(--mx) * 0.12vw),
    calc((var(--d) * 52vh) + (var(--my) * 0.1vh)),
    0
  );
}

.title-back .title-line {
  font-size: clamp(3rem, 7.7vw, 9rem);
}

.layer-mid {
  z-index: 4;
}

.layer-mid-left {
  transform: translate3d(
    calc((var(--d) * 1.2vw) + (var(--mx) * -0.42vw)),
    calc((var(--d) * -3.8vh) + (var(--my) * -0.24vh)),
    0
  );
}

.layer-mid-right {
  transform: translate3d(
    calc((var(--d) * -1.2vw) + (var(--mx) * -0.42vw)),
    calc((var(--d) * -3.8vh) + (var(--my) * -0.24vh)),
    0
  );
}

.title-middle {
  z-index: 5;
  top: 40.5vh;
  opacity: var(--middle-o);
  transform: translate3d(
    calc(-50% + var(--mx) * 0.18vw),
    calc((var(--d) * 61vh) + (var(--my) * 0.14vh)),
    0
  );
}

.title-middle .title-line {
  font-size: clamp(3.1rem, 8.5vw, 10rem);
}

.layer-near {
  z-index: 6;
}

.layer-near-left {
  transform: translate3d(
    calc((var(--d) * 1.8vw) + (var(--mx) * -0.68vw)),
    calc((var(--d) * -5vh) + (var(--my) * -0.38vh)),
    0
  );
}

.layer-near-right {
  transform: translate3d(
    calc((var(--d) * -1.8vw) + (var(--mx) * -0.68vw)),
    calc((var(--d) * -5vh) + (var(--my) * -0.38vh)),
    0
  );
}

.title-front {
  z-index: 7;
  top: 57vh;
  opacity: var(--front-o);
  transform: translate3d(
    calc(-50% + var(--mx) * 0.24vw),
    calc((var(--d) * 69vh) + (var(--my) * 0.2vh)),
    0
  );
}

.year {
  font-size: clamp(5.4rem, 13.8vw, 16rem);
  font-weight: 700;
  line-height: 0.68;
  letter-spacing: -0.09em;
  padding-right: 0.075em;
  color: rgba(244, 242, 223, 0.96);
  -webkit-text-stroke: 1px rgba(20, 36, 26, 0.18);
}

.layer-foreground {
  z-index: 8;
  transform: translate3d(
    calc(var(--mx) * -0.95vw),
    calc((var(--d) * -4.8vh) + (var(--my) * -0.55vh)),
    0
  );
}

.light-rays {
  position: absolute;
  z-index: 9;
  inset: -25%;
  opacity: calc(0.3 - var(--exit) * 0.22);
  background:
    linear-gradient(118deg, transparent 14%, rgba(255, 238, 181, 0.13) 23%, transparent 30%),
    linear-gradient(116deg, transparent 23%, rgba(255, 247, 205, 0.08) 31%, transparent 39%);
  transform: translate3d(calc(var(--d) * -1vw), calc(var(--d) * 1vh), 0);
  mix-blend-mode: screen;
  pointer-events: none;
}

.cinematic-grade {
  position: absolute;
  z-index: 10;
  inset: 0;
  background:
    linear-gradient(180deg, rgba(6, 16, 11, 0.16), transparent 28%, transparent 68%, rgba(3, 10, 7, 0.36)),
    radial-gradient(circle at 50% 48%, transparent 36%, rgba(2, 9, 6, 0.22) 100%);
  pointer-events: none;
}

.film-grain {
  position: absolute;
  z-index: 11;
  inset: -80px;
  opacity: 0.075;
  pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.52'/%3E%3C/svg%3E");
  animation: grain 0.22s steps(2) infinite;
  mix-blend-mode: soft-light;
}

.exit-shade {
  position: absolute;
  z-index: 12;
  inset: 0;
  opacity: var(--exit);
  background: radial-gradient(circle at 50% 34%, rgba(6, 17, 11, 0.22), #030906 78%);
  pointer-events: none;
}

.hero-chrome {
  z-index: 20;
  color: var(--ivory);
  text-transform: uppercase;
  letter-spacing: 0.16em;
  pointer-events: none;
  opacity: calc(1 - var(--exit) * 0.92);
}

.edition-mark,
.coordinates,
.journey-note,
.scroll-cue,
.progress-rail {
  position: absolute;
  font-size: 0.62rem;
  font-weight: 600;
  text-shadow: 0 2px 10px rgba(2, 10, 6, 0.45);
}

.edition-mark {
  top: 4.4vh;
  left: clamp(22px, 3.2vw, 58px);
  display: flex;
  align-items: center;
  gap: 12px;
}

.edition-dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: #dbe9a1;
  box-shadow: 0 0 0 4px rgba(219, 233, 161, 0.14);
}

.coordinates {
  top: 4.4vh;
  right: clamp(22px, 3.2vw, 58px);
  display: flex;
  gap: 16px;
}

.journey-note {
  left: clamp(22px, 3.2vw, 58px);
  bottom: 5vh;
  display: grid;
  grid-template-columns: auto 42px auto;
  align-items: start;
  gap: 12px;
  line-height: 1.65;
}

.journey-index {
  color: #dbe9a1;
}

.journey-rule {
  margin-top: 5px;
  height: 1px;
  background: var(--line);
}

.journey-copy {
  letter-spacing: 0.11em;
}

.scroll-cue {
  left: 50%;
  bottom: 4.2vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  transform: translateX(-50%);
  opacity: calc(1 - var(--d) * 1.55);
}

.scroll-line {
  position: relative;
  display: block;
  width: 1px;
  height: 38px;
  overflow: hidden;
  background: rgba(255, 255, 255, 0.25);
}

.scroll-line i {
  position: absolute;
  inset: 0;
  background: #edf3cf;
  transform-origin: top;
  animation: scrollPulse 1.8s cubic-bezier(0.65, 0, 0.35, 1) infinite;
}

.progress-rail {
  right: clamp(19px, 2vw, 34px);
  top: 50%;
  display: grid;
  grid-template-columns: auto 1px;
  grid-template-rows: auto 130px auto;
  align-items: center;
  gap: 12px 10px;
  transform: translateY(-50%);
}

.progress-label {
  grid-column: 1;
  grid-row: 2;
  align-self: center;
  writing-mode: vertical-rl;
  transform: rotate(180deg);
}

.progress-track {
  position: relative;
  grid-column: 2;
  grid-row: 2;
  width: 1px;
  height: 130px;
  overflow: hidden;
  background: rgba(255, 255, 255, 0.24);
}

.progress-track i {
  position: absolute;
  inset: 0;
  background: #eff4d3;
  transform: scaleY(var(--p));
  transform-origin: top;
}

.progress-number {
  grid-column: 1 / 3;
  grid-row: 3;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

@keyframes grain {
  0% { transform: translate3d(-2%, 1%, 0); }
  25% { transform: translate3d(1%, -2%, 0); }
  50% { transform: translate3d(2%, 2%, 0); }
  75% { transform: translate3d(-1%, -1%, 0); }
  100% { transform: translate3d(0, 2%, 0); }
}

@keyframes scrollPulse {
  0% { transform: translateY(-100%) scaleY(0.4); }
  45% { transform: translateY(0) scaleY(1); }
  100% { transform: translateY(100%) scaleY(0.35); }
}

@media (max-width: 760px) {
  .parallax-hero {
    height: 360vh;
  }

  .hero-sticky {
    min-height: 560px;
  }

  .layer {
    top: -4vh;
    left: -28vw;
    width: 156vw;
    height: 108vh;
    object-position: 50% center;
  }

  .title-band {
    width: 118vw;
  }

  .title-line {
    flex-direction: column;
    gap: 0.08em;
    line-height: 0.76;
  }

  .title-back {
    top: 20vh;
  }

  .title-back .title-line {
    font-size: clamp(3.2rem, 15.5vw, 6rem);
  }

  .title-middle {
    top: 42vh;
  }

  .title-middle .title-line {
    font-size: clamp(3rem, 14.2vw, 5.5rem);
  }

  .title-front {
    top: 67vh;
  }

  .year {
    font-size: clamp(6rem, 27vw, 10rem);
  }

  .coordinates,
  .journey-note {
    display: none;
  }

  .edition-mark {
    right: 22px;
    justify-content: space-between;
  }

  .progress-rail {
    right: 14px;
  }

  .scroll-cue {
    bottom: 3vh;
  }
}

@media (prefers-reduced-motion: reduce) {
  .film-grain,
  .scroll-line i {
    animation: none;
  }

  .layer,
  .title-band,
  .mist,
  .light-rays {
    will-change: auto;
  }
}

</style>
</head>

        </div>

        <div class="hero-chrome">
          <div class="edition-mark">
            <span>Himalayan Edition</span>
            <span class="edition-dot"></span>
            <span>November 2026</span>
          </div>

          <div class="coordinates">
            <span>30.3165° N</span>
            <span>78.0322° E</span>
          </div>

          <div class="journey-note">
            <span class="journey-index">01</span>
            <span class="journey-rule"></span>
            <span class="journey-copy">A climb for awareness.<br>A horizon without limits.</span>
          </div>

          <div class="scroll-cue">
            <span>Enter the valley</span>
            <span class="scroll-line"><i></i></span>
          </div>

          <div class="progress-rail">
            <span class="progress-label">Descent</span>
            <span class="progress-track"><i></i></span>
            <span class="progress-number">00</span>
          </div>
        </div>
      </div>

  </main>
  <script>
(() => {
  const hero = document.querySelector('.parallax-hero');
  const progressNumber = document.querySelector('.progress-number');
  if (!hero) return;

  const root = document.documentElement;
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let targetProgress = 0;
  let currentProgress = 0;
  let targetMouseX = 0;
  let targetMouseY = 0;
  let mouseX = 0;
  let mouseY = 0;
  let frameId = 0;

  const clamp = (value, min = 0, max = 1) => Math.min(max, Math.max(min, value));
  const smoothstep = (from, to, value) => {
    const x = clamp((value - from) / (to - from));
    return x * x * (3 - 2 * x);
  };

  const measure = () => {
    const rect = hero.getBoundingClientRect();
    const distance = Math.max(1, hero.offsetHeight - window.innerHeight);
    targetProgress = clamp(-rect.top / distance);
  };

  const render = () => {
    const progressEase = reducedMotion ? 1 : 0.075;
    const pointerEase = reducedMotion ? 1 : 0.045;
    currentProgress += (targetProgress - currentProgress) * progressEase;
    mouseX += (targetMouseX - mouseX) * pointerEase;
    mouseY += (targetMouseY - mouseY) * pointerEase;

    const descent = smoothstep(0.055, 0.78, currentProgress);
    const exit = smoothstep(0.79, 1, currentProgress);
    const intro = smoothstep(0, 0.08, currentProgress);

    const backOpacity = 1 - smoothstep(0.47, 0.72, currentProgress);
    const middleOpacity = 1 - smoothstep(0.57, 0.82, currentProgress);
    const frontOpacity = 1 - smoothstep(0.69, 0.93, currentProgress);

    root.style.setProperty('--p', currentProgress.toFixed(5));
    root.style.setProperty('--d', descent.toFixed(5));
    root.style.setProperty('--intro', intro.toFixed(5));
    root.style.setProperty('--exit', exit.toFixed(5));
    root.style.setProperty('--mx', mouseX.toFixed(4));
    root.style.setProperty('--my', mouseY.toFixed(4));
    root.style.setProperty('--back-o', backOpacity.toFixed(4));
    root.style.setProperty('--middle-o', middleOpacity.toFixed(4));
    root.style.setProperty('--front-o', frontOpacity.toFixed(4));

    if (progressNumber) {
      progressNumber.textContent = String(Math.round(currentProgress * 100)).padStart(2, '0');
    }

    frameId = requestAnimationFrame(render);
  };

  const onPointerMove = (event) => {
    if (reducedMotion) return;
    targetMouseX = clamp((event.clientX / window.innerWidth - 0.5) * 2, -1, 1);
    targetMouseY = clamp((event.clientY / window.innerHeight - 0.5) * 2, -1, 1);
  };

  const onPointerLeave = () => {
    targetMouseX = 0;
    targetMouseY = 0;
  };

  window.addEventListener('scroll', measure, { passive: true });
  window.addEventListener('resize', measure, { passive: true });
  window.addEventListener('pointermove', onPointerMove, { passive: true });
  document.documentElement.addEventListener('mouseleave', onPointerLeave);

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      cancelAnimationFrame(frameId);
    } else {
      frameId = requestAnimationFrame(render);
    }
  });

  measure();
  render();
})();

</script>
